aid: beehero
name: BeeHero
description: >-
  BeeHero is a precision-pollination company that instruments commercial beehives and crop fields with
  low-cost IoT sensors, then turns the resulting acoustic, temperature, humidity and bee-activity data
  into pollination analytics for growers, beekeepers and agribusinesses. Founded in 2017 by Omer Davidi,
  Itai Kanot and Yuval Regev, with operations in California and Tel Aviv, it runs an in-hive
  Precision-Pollination-as-a-Service offering and an in-field Pollination Insight Platform (PIP) across
  crops including almonds, apples, avocados, blueberries, canola, cherries, carrot and onion seed,
  cucurbits and macadamia. BeeHero exposes a bearer-token REST API at backend.beehero.io/external —
  documented with Swagger UI at docs.beehero.io — for sensor samples, in-hive audio samples and gateway
  configuration, and publishes an official BeeHero MCP server to npm for agent access to its platform
  entities (groups, farms, orchards, yards, gateways, sensors, inspections, experiments).
