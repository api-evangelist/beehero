server:
  name: beehero
  display_name: BeeHero
  server_name: beehero-mcp-server
  transport: stdio
  version: 1.3.8
  command: node
  args:
  - dist/server.js
  package: https://www.npmjs.com/package/beehero-mcp
  install:
  - npm install -g beehero-mcp
  - 'MCPB bundle shipped in the tarball: beehero.1.3.8.mcpb'
  runtime: node
  license: ISC
  author: BeeHero <support@beehero.io>
  homepage: https://beehero.io
  hosted_url: null
  hosted_note: No remote/hosted MCP endpoint is published. The server runs locally over stdio and calls
