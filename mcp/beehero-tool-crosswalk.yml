summary: >-
  BeeHero's two machine-readable surfaces do not overlap. The public OpenAPI documents the
  /external device-data surface on backend.beehero.io (login, sensor samples, in-hive audio samples,
  gateway configuration). The official MCP server calls a different, undocumented admin surface
  (/admin/* and /v2/admin/*) covering platform entities — groups, farms, orchards, yards, gateways,
  sensors, inspections, experiments, hardware. Not one MCP tool binds to a published OpenAPI
  operationId, so every tool lands in mcp_only[] and every REST operation lands in rest_only[].
  This is a real surface divergence, recorded rather than papered over.
